name: Update Pi-hole blocklist

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-pihole-blocklist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run parser tests
        run: python -m unittest discover -s tests -v

      - name: Build Pi-hole-compatible list
        run: python scripts/build_blocklist.py

      - name: Commit changed output
        shell: bash
        run: |
          if git diff --quiet -- build/; then
            echo "No blocklist changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/
          git commit -m "chore: update aggregated Pi-hole blocklist"
          git push
